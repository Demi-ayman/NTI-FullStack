<div class="cart-container" *ngIf="cartItems.length; else emptyCart">
  <h2 class="cart-title">🛒 My Shopping Cart</h2>

  <div class="cart-layout">
    <div class="cart-items">
      <div *ngFor="let item of cartItems" class="cart-card">
        <img
          [src]="staticURL + item.product.imgURL"
          (error)="handleImageError($event)"
          alt="{{ item.product.name }}"
          class="product-image"
        />

        <div class="product-details">
          <h3>{{ item.product.name }}</h3>
          <p class="price">Price: ${{ item.price }}</p>

          <div class="quantity-control">
            <button (click)="updateQuantity(item, -1)">−</button>
            <span>{{ item.quantity }}</span>
            <button (click)="updateQuantity(item, 1)">+</button>
          </div>

          <button class="remove-btn" (click)="removeItem(item.product._id)">
            <i class="fa fa-trash"></i> Remove
          </button>
        </div>
      </div>
    </div>

    <div class="summary">
      <h3>Order Summary</h3>
      <p>Items: {{ cartItems.length }}</p>
      <p>Total: <strong>${{ totalPrice }}</strong></p>

      <button class="checkout-btn" (click)="proceedToCheckout()" [disabled]="isLoading">
        {{ isLoading ? 'Processing...' : 'Checkout' }}
      </button>

      <button class="clear-btn" (click)="clearCart()">Clear Cart</button>
    </div>
  </div>
</div>

<ng-template #emptyCart>
  <div class="empty-cart">
    <img src="/src/assets/hero.jpg" alt="Empty cart" />
    <h2>Your cart is empty</h2>
    <p>Start shopping to add items!</p>
    <a routerLink="/shop" class="shop-now-btn">Go to Shop</a>
  </div>
</ng-template>
